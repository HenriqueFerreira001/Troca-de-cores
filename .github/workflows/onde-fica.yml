# Uso pontual: procura a Usinas 2A (Mogi das Cruzes) no IBGE (CNEFE) e no OpenStreetMap.
name: Onde fica
on:
  push:
    paths:
      - '.github/workflows/onde-fica.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  onde:
    runs-on: ubuntu-latest
    steps:
      - name: OpenStreetMap
        continue-on-error: true
        run: |
          Q='[out:json][timeout:60];(nwr["name"~"2A|2 A|Usina|Asfalto|Pedreira|Minera",i](-23.56,-46.33,-23.42,-46.15);nwr["landuse"="quarry"](-23.56,-46.33,-23.42,-46.15);nwr["industrial"](-23.56,-46.33,-23.42,-46.15););out center tags;'
          curl -sS -m 90 -A 'RotaCerta/1.0' --data-urlencode "data=$Q" https://overpass-api.de/api/interpreter | python3 -c "
          import sys,json
          for e in json.load(sys.stdin)['elements']:
              c=e.get('center',e); t=e.get('tags',{})
              print(e['type'], c.get('lat'), c.get('lon'), '|', t.get('name',''), '|', t.get('landuse',''), t.get('industrial',''), t.get('operator',''), t.get('addr:street',''))
          "
          echo "== Nominatim"
          for q in "Usinas 2A Mogi das Cruzes" "Usina 2A Mogi das Cruzes" "2A Usina de Asfalto" "Pedreira Itapeti Mogi das Cruzes"; do
            echo "-- $q"; curl -sS -m 30 -A 'RotaCerta/1.0' "https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=br&limit=5&q=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$q")" | python3 -c "import sys,json;[print(x['lat'],x['lon'],x['display_name']) for x in json.load(sys.stdin)]"; sleep 1.2
          done
      - name: IBGE (CNEFE) de Mogi das Cruzes
        timeout-minutes: 20
        run: |
          COD=3530607
          BASE="https://ftp.ibge.gov.br/Cadastro_Nacional_de_Enderecos_para_Fins_Estatisticos/Censo_Demografico_2022/Arquivos_CNEFE/CSV/Municipio"
          PASTA=$(curl -sSL "$BASE/" | grep -o "href=\"${COD:0:2}_[A-Z]*/\"" | head -1 | sed 's/href="//; s/"//')
          ARQ=$(curl -sSL "$BASE/$PASTA" | grep -o "href=\"${COD}_[^\"]*\.zip\"" | head -1 | sed 's/href="//; s/"//')
          curl -sSL -o m.zip "$BASE/$PASTA$ARQ" && unzip -o -q m.zip -d m
          CSV=$(find m -iname '*.csv' | head -1)
          echo "== Estabelecimentos com USINA / ASFALT / 2A / PEDREIRA / MINERA"
          grep -ai "USINA\|ASFALT\|;2 \?A;\|2A \|PEDREIRA\|MINERA\|BRITA\|CONCRETO" "$CSV" | awk -F';' '{print $26","$27" | "$10" | "$11" "$12" "$13" "$14" "$15" | "$30}' | grep -vi "^ *, " | head -60
          echo "== Todos os endereços da Estrada do Itapeti das Furnas (número, lugar, coordenada, estabelecimento)"
          grep -ai ";ITAPETI DAS FURNAS;" "$CSV" | awk -F';' '{print $14" "$15" | "$10" | "$26","$27" | esp="$29" | "$30}' | sort -n | uniq | head -150
          echo "== Logradouros com ITAPETI"
          grep -ai "ITAPETI" "$CSV" | awk -F';' '{print $11" "$12" "$13" | "$9}' | sort | uniq -c | sort -rn | head -20
