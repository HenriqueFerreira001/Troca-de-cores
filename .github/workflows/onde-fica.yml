# Uso pontual: procura um endereço nos mapas gratuitos (o ambiente de desenvolvimento não tem acesso a eles).
name: Onde fica
on:
  push:
    paths:
      - 'tools/onde.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  onde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/onde.js
