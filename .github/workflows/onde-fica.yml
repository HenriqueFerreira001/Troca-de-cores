# Uso pontual: procura a Usinas 2A (Mogi das Cruzes) no IBGE (CNEFE) e no OpenStreetMap.
name: Onde fica
on:
  push:
    paths:
      - '.github/workflows/onde-fica.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  onde:
    runs-on: ubuntu-latest
    steps:
      - name: IBGE (CNEFE) de Mogi das Cruzes
        timeout-minutes: 20
        run: |
          COD=3530607
          BASE="https://ftp.ibge.gov.br/Cadastro_Nacional_de_Enderecos_para_Fins_Estatisticos/Censo_Demografico_2022/Arquivos_CNEFE/CSV/Municipio"
          PASTA=$(curl -sSL "$BASE/" | grep -o "href=\"${COD:0:2}_[A-Z]*/\"" | head -1 | sed 's/href="//; s/"//')
          ARQ=$(curl -sSL "$BASE/$PASTA" | grep -o "href=\"${COD}_[^\"]*\.zip\"" | head -1 | sed 's/href="//; s/"//')
          curl -sSL -o m.zip "$BASE/$PASTA$ARQ" && unzip -o -q m.zip -d m
          CSV=$(find m -iname '*.csv' | head -1)
          echo "== Itapeti das Furnas, trecho norte (CEP 08790000), do sul para o norte"
          grep -ai ";ITAPETI DAS FURNAS;" "$CSV" | grep -a ";08790000;" | awk -F';' '{print $26","$27" | "$14" "$15" | "$10" | "$30}' | sort -t, -k1 -r | uniq | head -100
          echo "== Lugares no CEP 08790000"
          grep -a ";08790000;" "$CSV" | awk -F';' '{print $10" | "$11" "$13}' | sort | uniq -c | sort -rn | head -20
          echo "== Mais ao norte e mais ao sul da estrada"
          grep -ai ";ITAPETI DAS FURNAS;" "$CSV" | awk -F';' '{print $26","$27" "$9}' | sort -t, -k1 -n | sed -n '1p;$p'
