# Uso pontual: procura endereços de um CEP / rua no cadastro do IBGE (CNEFE 2022) de uma cidade.
name: Onde fica
on:
  push:
    paths:
      - '.github/workflows/onde-fica.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  onde:
    runs-on: ubuntu-latest
    steps:
      - name: CEP com coordenadas (AwesomeAPI e BrasilAPI)
        run: |
          echo "== AwesomeAPI"; curl -sS -m 30 https://cep.awesomeapi.com.br/json/08771001; echo
          echo "== BrasilAPI v2"; curl -sS -m 30 https://brasilapi.com.br/api/cep/v2/08771001; echo
          echo "== OpenCEP"; curl -sS -m 30 https://opencep.com/v1/08771001; echo
          echo "== Nominatim CEP"; curl -sS -m 30 -A 'RotaCerta/1.0' 'https://nominatim.openstreetmap.org/search?format=jsonv2&postalcode=08771-001&countrycodes=br'; echo
          echo "== Nominatim Parque Residencial Itapeti"; curl -sS -m 30 -A 'RotaCerta/1.0' 'https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=br&q=Parque%20Residencial%20Itapeti%20Mogi%20das%20Cruzes'; echo
          echo "== Nominatim Estrada do Itapeti"; curl -sS -m 30 -A 'RotaCerta/1.0' 'https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=br&street=Estrada%20do%20Itapeti&city=Mogi%20das%20Cruzes'; echo
      - name: Procurar no CNEFE de Mogi das Cruzes
        continue-on-error: true
        timeout-minutes: 15
        run: |
          COD=3530607
          BASE="https://ftp.ibge.gov.br/Cadastro_Nacional_de_Enderecos_para_Fins_Estatisticos/Censo_Demografico_2022/Arquivos_CNEFE/CSV/Municipio"
          PASTA=$(curl -sSL "$BASE/" | grep -o "href=\"${COD:0:2}_[A-Z]*/\"" | head -1 | sed 's/href="//; s/"//')
          ARQ=$(curl -sSL "$BASE/$PASTA" | grep -o "href=\"${COD}_[^\"]*\.zip\"" | head -1 | sed 's/href="//; s/"//')
          curl -sSL -o m.zip "$BASE/$PASTA$ARQ" && unzip -o -q m.zip -d m
          CSV=$(find m -iname '*.csv' | head -1)
          head -1 "$CSV"
          echo "== CEP 08771001"
          grep -a "08771001" "$CSV" | head -80
          echo "== Linhas com FURNAS"
          grep -ai "ITAPETI DAS FURNAS\|ITAPETI.*FURNAS" "$CSV" | head -40
          echo "== Contagem por logradouro no CEP"
          grep -a "08771001" "$CSV" | awk -F';' '{print $9" "$10" "$11}' | sort | uniq -c | sort -rn | head -20
