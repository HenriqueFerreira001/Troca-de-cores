# Roda uma lista de endereços de verdade (testes-rota/*.json) com os mesmos
# serviços e o mesmo otimizador do app, e mostra a ordem no resumo da execução.
name: Testar rota

on:
  push:
    paths:
      - 'testes-rota/**'
      - 'tools/rota-cli.js'
      - 'enderecos.js'
      - 'tools/variantes.js'
      - 'dados/cnefe/**'
      - 'solver.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rota:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/solver.test.js
      - name: Organizar rotas
        run: |
          for f in testes-rota/*.json; do
            node tools/rota-cli.js "$f" | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - name: Comparar variantes com o Zeo
        run: |
          for f in testes-rota/*.json; do
            if grep -q compararCom "$f"; then node tools/variantes.js "$f" | tee -a "$GITHUB_STEP_SUMMARY"; fi
          done
